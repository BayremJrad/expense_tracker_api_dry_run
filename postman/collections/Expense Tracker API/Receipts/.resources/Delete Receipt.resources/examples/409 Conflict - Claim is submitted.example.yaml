$kind: http-example
name: '409 Conflict - Claim is submitted'
request:
  method: DELETE
  url: '{{baseUrl}}/expenses/exp_005/receipts/rec_010'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "EXPENSE_NOT_EDITABLE",
          "rule": "BR-25",
          "message": "Receipts cannot be removed from an expense that is part of a submitted claim."
        }
      }
