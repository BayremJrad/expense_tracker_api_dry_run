$kind: http-example
name: '422 Unprocessable - Max receipts reached'
request:
  method: POST
  url: '{{baseUrl}}/expenses/exp_001/receipts'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
    - key: Content-Type
      value: multipart/form-data
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "MAX_RECEIPTS_REACHED",
          "rule": "NFR-07",
          "message": "This expense already has 10 receipts attached, which is the maximum allowed."
        }
      }
