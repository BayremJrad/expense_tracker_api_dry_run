$kind: http-request
name: Update Claim
order: 4000
description: |-
  Updates a claim's title or expense list while it is in draft status.
  Only the claim owner may update it.
  
  **Business rules:**
  - Can only update a claim in draft status
  - Expenses added must be unclaimed and belong to the owner (BR-22)
  - Expenses incurred more than 90 days ago cannot be added (BR-18)
  - A claim must retain at least one expense (BR-21)
method: PATCH
url: '{{baseUrl}}/claims/:claimId'
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: claimId
    value: clm_001
    description: The unique identifier of the claim to update.
body:
  type: json
  content: |-
    {
      "title": "September 2026 - Client site visits (updated)",
      "expenseIds": ["exp_001", "exp_002", "exp_003"]
    }
examples: './.resources/Update Claim.resources/examples/'
