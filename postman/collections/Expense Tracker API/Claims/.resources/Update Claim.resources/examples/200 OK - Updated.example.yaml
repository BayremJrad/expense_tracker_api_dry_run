$kind: http-example
name: '200 OK - Updated'
request:
  method: PATCH
  url: '{{baseUrl}}/claims/clm_001'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "September 2026 - Client site visits (updated)",
        "expenseIds": ["exp_001", "exp_002", "exp_003"]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "clm_001",
        "title": "September 2026 - Client site visits (updated)",
        "status": "draft",
        "totalEur": 312.19,
        "expenseCount": 3,
        "ownerId": "usr_123",
        "createdAt": "2026-09-23T09:00:00Z",
        "updatedAt": "2026-09-23T10:00:00Z"
      }
