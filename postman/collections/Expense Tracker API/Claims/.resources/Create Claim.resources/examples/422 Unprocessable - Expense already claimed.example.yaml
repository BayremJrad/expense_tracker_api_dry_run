$kind: http-example
name: '422 Unprocessable - Expense already claimed'
request:
  method: POST
  url: '{{baseUrl}}/claims'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "Duplicate claim attempt",
        "expenseIds": ["exp_005"]
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "EXPENSE_ALREADY_CLAIMED",
          "rule": "BR-22",
          "message": "Expense 'exp_005' is already part of claim 'clm_003'.",
          "field": "expenseIds"
        }
      }
