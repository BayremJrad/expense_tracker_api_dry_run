$kind: http-example
name: '422 Unprocessable - Missing reason'
request:
  method: POST
  url: '{{baseUrl}}/claims/clm_010/reject'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {}
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "rule": "BR-24",
          "message": "A rejection reason is required.",
          "field": "reason"
        }
      }
