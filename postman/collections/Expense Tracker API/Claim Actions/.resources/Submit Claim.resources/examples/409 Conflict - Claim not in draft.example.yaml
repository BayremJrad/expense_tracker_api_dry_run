$kind: http-example
name: '409 Conflict - Claim not in draft'
request:
  method: POST
  url: '{{baseUrl}}/claims/clm_010/submit'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "INVALID_STATUS_TRANSITION",
          "rule": "BR-23",
          "message": "Claim 'clm_010' is already in 'submitted' status. Only draft claims can be submitted."
        }
      }
