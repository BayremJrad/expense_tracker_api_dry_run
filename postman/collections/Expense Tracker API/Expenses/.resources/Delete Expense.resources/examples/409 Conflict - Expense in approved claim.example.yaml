$kind: http-example
name: '409 Conflict - Expense in approved claim'
request:
  method: DELETE
  url: '{{baseUrl}}/expenses/exp_005'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "EXPENSE_NOT_EDITABLE",
          "rule": "BR-25",
          "message": "This expense belongs to claim 'clm_010' which is in 'approved' status and cannot be deleted."
        }
      }
