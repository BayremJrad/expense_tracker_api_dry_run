$kind: http-example
name: '200 OK - Filtered unclaimed expenses'
request:
  method: GET
  url: '{{baseUrl}}/expenses?claimed=false&dateFrom=2026-09-01&dateTo=2026-09-30'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "exp_001",
            "amount": 120.50,
            "currency": "GBP",
            "amountEur": 142.19,
            "dateIncurred": "2026-09-10",
            "category": {
              "id": "cat_01",
              "name": "Travel"
            },
            "description": "Train to Manchester client site",
            "paymentMethod": "personal",
            "clientReference": null,
            "receiptCount": 1,
            "claimId": null,
            "ownerId": "usr_123",
            "recordedAt": "2026-09-10T18:30:00Z"
          }
        ],
        "pagination": {
          "page": 1,
          "pageSize": 20,
          "total": 1,
          "totalPages": 1
        }
      }
