$kind: http-request
name: Delete Expense
order: 5000
description: |-
  Deletes an expense. Only the owner may delete it (BR-02, BR-05).
  
  **Business rules:**
  - Cannot delete an expense that is part of a submitted, approved, or reimbursed claim (BR-25)
method: DELETE
url: '{{baseUrl}}/expenses/:expenseId'
pathVariables:
  - key: expenseId
    value: exp_001
    description: The unique identifier of the expense to delete.
examples: './.resources/Delete Expense.resources/examples/'
