$kind: http-example
name: '401 Unauthorized'
request:
  method: GET
  url: '{{baseUrl}}/categories'
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "UNAUTHORIZED",
          "message": "Authentication is required. Please provide a valid Bearer token."
        }
      }
