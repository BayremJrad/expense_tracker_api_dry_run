$kind: http-example
name: '404 Not Found'
request:
  method: GET
  url: '{{baseUrl}}/categories/cat_999'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "CATEGORY_NOT_FOUND",
          "message": "No category found with id 'cat_999'."
        }
      }
