$kind: http-example
name: '200 OK - Updated'
request:
  method: PATCH
  url: '{{baseUrl}}/categories/cat_01'
  headers:
    - key: Authorization
      value: 'Bearer {{authToken}}'
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "receiptThreshold": 75.00
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "cat_01",
        "name": "Travel",
        "receiptThreshold": 75.00,
        "requiresReceiptAlways": false,
        "requiresClientReference": false,
        "active": true,
        "createdAt": "2025-01-01T00:00:00Z",
        "updatedAt": "2026-09-23T10:05:00Z"
      }
