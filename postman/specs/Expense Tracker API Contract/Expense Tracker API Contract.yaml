openapi: 3.0.0
info:
  title: Expense Tracker API Contract
  version: 1.0.0
  description: |-
    API for Northbeam Consulting's Expense Tracker service. Allows employees to record expenses, attach receipts, group them into claims, and submit for approval. Approvers can review and approve/reject claims. Finance can manage categories and mark claims as reimbursed.

    **Roles:**
    - **Employee** – records expenses, attaches receipts, creates and submits claims
    - **Approver** – reviews and approves/rejects submitted claims
    - **Finance** – manages categories, marks claims as reimbursed, runs reports

    **Base URL:** `{{baseUrl}}`

    **Authentication:** Bearer token required on all endpoints (NFR-01).
servers:
  - url: '{{baseUrl}}'
paths:
  /categories:
    get:
      summary: List Categories
      parameters:
        - name: includeRetired
          in: query
          description: Set to true (Finance only) to include retired categories in the response.
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: 200 OK - Active categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        receiptThreshold:
                          type: integer
                        requiresReceiptAlways:
                          type: boolean
                        requiresClientReference:
                          type: boolean
                        active:
                          type: boolean
                  total:
                    type: integer
              example:
                data:
                  - id: cat_01
                    name: Travel
                    receiptThreshold: 50
                    requiresReceiptAlways: false
                    requiresClientReference: false
                    active: true
                  - id: cat_02
                    name: Accommodation
                    receiptThreshold: 0.01
                    requiresReceiptAlways: true
                    requiresClientReference: false
                    active: true
                  - id: cat_03
                    name: Meals
                    receiptThreshold: 25
                    requiresReceiptAlways: false
                    requiresClientReference: false
                    active: true
                  - id: cat_04
                    name: Software
                    receiptThreshold: 10
                    requiresReceiptAlways: false
                    requiresClientReference: false
                    active: true
                  - id: cat_05
                    name: Client Entertainment
                    receiptThreshold: 0.01
                    requiresReceiptAlways: true
                    requiresClientReference: true
                    active: true
                total: 5
        '401':
          description: 401 Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication is required. Please provide a valid Bearer token.
      tags:
        - Categories
      description: |-
        Returns all active categories available for use on new expenses.
        Finance may also see retired categories by passing `includeRetired=true`.

        **BR-06** – Any authenticated user can retrieve the category list.
        **BR-08** – Read-only for employees and approvers.
    post:
      summary: Create Category
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  receiptThreshold:
                    type: number
                  requiresReceiptAlways:
                    type: boolean
                  requiresClientReference:
                    type: boolean
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: cat_05
                name: Client Entertainment
                receiptThreshold: 0.01
                requiresReceiptAlways: true
                requiresClientReference: true
                active: true
                createdAt: '2026-09-23T10:00:00Z'
                updatedAt: '2026-09-23T10:00:00Z'
        '403':
          description: 403 Forbidden - Not Finance
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: FORBIDDEN
                  rule: BR-08
                  message: Only Finance may modify the category list.
      tags:
        - Categories
      description: |-
        Creates a new expense category. **Finance role required** (BR-07, BR-08).

        The `receiptThreshold` is the amount above which a receipt becomes mandatory.
        Set `requiresReceiptAlways: true` to mandate a receipt at any amount.
        Set `requiresClientReference: true` for categories like Client Entertainment (BR-20).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                receiptThreshold:
                  type: number
                requiresReceiptAlways:
                  type: boolean
                requiresClientReference:
                  type: boolean
            example:
              name: Client Entertainment
              receiptThreshold: 0.01
              requiresReceiptAlways: true
              requiresClientReference: true
  '/categories/{categoryId}':
    get:
      summary: Get Category
      responses:
        '200':
          description: 200 OK - Category found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  receiptThreshold:
                    type: integer
                  requiresReceiptAlways:
                    type: boolean
                  requiresClientReference:
                    type: boolean
                  active:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: cat_01
                name: Travel
                receiptThreshold: 50
                requiresReceiptAlways: false
                requiresClientReference: false
                active: true
                createdAt: '2025-01-01T00:00:00Z'
                updatedAt: '2025-01-01T00:00:00Z'
        '404':
          description: 404 Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: CATEGORY_NOT_FOUND
                  message: No category found with id 'cat_999'.
      tags:
        - Categories
      description: 'Returns a single category by its ID, including whether it is active or retired.'
    parameters:
      - name: categoryId
        in: path
        required: true
        description: The unique identifier of the category to update.
        schema:
          type: string
        example: cat_01
    patch:
      summary: Update Category
      responses:
        '200':
          description: 200 OK - Category retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  receiptThreshold:
                    type: integer
                  requiresReceiptAlways:
                    type: boolean
                  requiresClientReference:
                    type: boolean
                  active:
                    type: boolean
                  retiredAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              examples:
                200 OK - Category retired:
                  value:
                    id: cat_04
                    name: Software
                    receiptThreshold: 10
                    requiresReceiptAlways: false
                    requiresClientReference: false
                    active: false
                    retiredAt: '2026-09-23T10:05:00Z'
                    updatedAt: '2026-09-23T10:05:00Z'
                200 OK - Updated:
                  value:
                    id: cat_01
                    name: Travel
                    receiptThreshold: 75
                    requiresReceiptAlways: false
                    requiresClientReference: false
                    active: true
                    createdAt: '2025-01-01T00:00:00Z'
                    updatedAt: '2026-09-23T10:05:00Z'
      tags:
        - Categories
      description: |-
        Updates an existing category's name, receipt threshold, or client reference requirement.
        **Finance role required** (BR-07, BR-08).

        Retiring a category (setting `active: false`) does not affect historic expenses (BR-30).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                receiptThreshold:
                  type: integer
            example:
              receiptThreshold: 75
  /expenses:
    get:
      summary: List Expenses
      parameters:
        - name: dateFrom
          in: query
          description: Filter expenses incurred on or after this date (ISO 8601).
          schema:
            type: string
          example: '2026-09-01'
        - name: dateTo
          in: query
          description: Filter expenses incurred on or before this date (ISO 8601).
          schema:
            type: string
          example: '2026-09-30'
        - name: categoryId
          in: query
          description: Filter by category ID.
          schema:
            type: string
          example: cat_01
        - name: claimed
          in: query
          description: Filter by whether the expense has been added to a claim. true | false
          schema:
            type: boolean
          example: false
        - name: page
          in: query
          description: Page number (1-based).
          schema:
            type: integer
          example: 1
        - name: pageSize
          in: query
          description: Number of results per page. Max 100.
          schema:
            type: integer
          example: 20
      responses:
        '200':
          description: 200 OK - Expenses list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        amount:
                          type: number
                        currency:
                          type: string
                        amountEur:
                          type: number
                        dateIncurred:
                          type: string
                          format: date
                        category:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                        description:
                          type: string
                        paymentMethod:
                          type: string
                        clientReference:
                          nullable: true
                        receiptCount:
                          type: integer
                        claimId:
                          nullable: true
                        ownerId:
                          type: string
                        recordedAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
              examples:
                200 OK - Expenses list:
                  value:
                    data:
                      - id: exp_001
                        amount: 120.5
                        currency: GBP
                        amountEur: 142.19
                        dateIncurred: '2026-09-10'
                        category:
                          id: cat_01
                          name: Travel
                        description: Train to Manchester client site
                        paymentMethod: personal
                        clientReference: null
                        receiptCount: 1
                        claimId: null
                        ownerId: usr_123
                        recordedAt: '2026-09-10T18:30:00Z'
                      - id: exp_002
                        amount: 45
                        currency: EUR
                        amountEur: 45
                        dateIncurred: '2026-09-11'
                        category:
                          id: cat_03
                          name: Meals
                        description: Team lunch during client workshop
                        paymentMethod: personal
                        clientReference: CLIENT-007
                        receiptCount: 1
                        claimId: null
                        ownerId: usr_123
                        recordedAt: '2026-09-11T13:00:00Z'
                    pagination:
                      page: 1
                      pageSize: 20
                      total: 2
                      totalPages: 1
                200 OK - Filtered unclaimed expenses:
                  value:
                    data:
                      - id: exp_001
                        amount: 120.5
                        currency: GBP
                        amountEur: 142.19
                        dateIncurred: '2026-09-10'
                        category:
                          id: cat_01
                          name: Travel
                        description: Train to Manchester client site
                        paymentMethod: personal
                        clientReference: null
                        receiptCount: 1
                        claimId: null
                        ownerId: usr_123
                        recordedAt: '2026-09-10T18:30:00Z'
                    pagination:
                      page: 1
                      pageSize: 20
                      total: 1
                      totalPages: 1
      tags:
        - Expenses
      description: |-
        Returns a paginated list of expenses for the authenticated employee.
        Finance may retrieve expenses across all employees for reporting (BR-14).

        Supports filtering by date range, category, and claimed status (BR-03).
        Results are paginated (NFR-05).
    post:
      summary: Create Expense
      responses:
        '201':
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  amount:
                    type: number
                  currency:
                    type: string
                  amountEur:
                    type: number
                  dateIncurred:
                    type: string
                    format: date
                  category:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  description:
                    type: string
                  paymentMethod:
                    type: string
                  clientReference:
                    nullable: true
                  receiptCount:
                    type: integer
                  claimId:
                    nullable: true
                  ownerId:
                    type: string
                  recordedAt:
                    type: string
                    format: date-time
              example:
                id: exp_001
                amount: 120.5
                currency: GBP
                amountEur: 142.19
                dateIncurred: '2026-09-10'
                category:
                  id: cat_01
                  name: Travel
                description: Train to Manchester client site
                paymentMethod: personal
                clientReference: null
                receiptCount: 0
                claimId: null
                ownerId: usr_123
                recordedAt: '2026-09-10T18:30:00Z'
        '422':
          description: 422 Unprocessable - Future date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
                      field:
                        type: string
              examples:
                422 Unprocessable - Future date:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      rule: BR-17
                      message: The date incurred must not be in the future.
                      field: dateIncurred
                422 Unprocessable - Zero amount:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      rule: BR-16
                      message: Expense amount must be greater than zero.
                      field: amount
      tags:
        - Expenses
      description: |-
        Records a new expense for the authenticated employee (BR-01).

        **Business rules:**
        - Amount must be greater than zero (BR-16)
        - Date incurred must not be in the future (BR-17)
        - Category must be an active category (BR-06)
        - For non-EUR currencies, the EUR equivalent is calculated using the exchange rate on the date incurred (BR-28)
        - Client Entertainment requires a client reference (BR-20)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                currency:
                  type: string
                dateIncurred:
                  type: string
                  format: date
                categoryId:
                  type: string
                description:
                  type: string
                paymentMethod:
                  type: string
                clientReference:
                  nullable: true
            example:
              amount: 120.5
              currency: GBP
              dateIncurred: '2026-09-10'
              categoryId: cat_01
              description: Train to Manchester client site
              paymentMethod: personal
              clientReference: null
  '/expenses/{expenseId}':
    get:
      summary: Get Expense
      responses:
        '200':
          description: 200 OK - Expense found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  amount:
                    type: number
                  currency:
                    type: string
                  amountEur:
                    type: number
                  dateIncurred:
                    type: string
                    format: date
                  category:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  description:
                    type: string
                  paymentMethod:
                    type: string
                  clientReference:
                    nullable: true
                  receipts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        filename:
                          type: string
                        mimeType:
                          type: string
                        sizeBytes:
                          type: integer
                        uploadedAt:
                          type: string
                          format: date-time
                  claimId:
                    nullable: true
                  ownerId:
                    type: string
                  recordedAt:
                    type: string
                    format: date-time
              example:
                id: exp_001
                amount: 120.5
                currency: GBP
                amountEur: 142.19
                dateIncurred: '2026-09-10'
                category:
                  id: cat_01
                  name: Travel
                description: Train to Manchester client site
                paymentMethod: personal
                clientReference: null
                receipts:
                  - id: rec_001
                    filename: train_receipt.jpg
                    mimeType: image/jpeg
                    sizeBytes: 204800
                    uploadedAt: '2026-09-10T18:35:00Z'
                claimId: null
                ownerId: usr_123
                recordedAt: '2026-09-10T18:30:00Z'
        '403':
          description: 403 Forbidden - Not owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: FORBIDDEN
                  rule: BR-05
                  message: You do not have permission to access this expense.
      tags:
        - Expenses
      description: |-
        Returns a single expense by ID. Employees can only retrieve their own expenses (BR-05).
        Finance can retrieve any expense.
    parameters:
      - name: expenseId
        in: path
        required: true
        description: The unique identifier of the expense to delete.
        schema:
          type: string
        example: exp_001
    patch:
      summary: Update Expense
      responses:
        '200':
          description: 200 OK - Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  amount:
                    type: integer
                  currency:
                    type: string
                  amountEur:
                    type: number
                  dateIncurred:
                    type: string
                    format: date
                  category:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                  description:
                    type: string
                  paymentMethod:
                    type: string
                  clientReference:
                    nullable: true
                  receiptCount:
                    type: integer
                  claimId:
                    nullable: true
                  ownerId:
                    type: string
                  recordedAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: exp_001
                amount: 135
                currency: GBP
                amountEur: 159.57
                dateIncurred: '2026-09-10'
                category:
                  id: cat_01
                  name: Travel
                description: Train to Manchester client site (return)
                paymentMethod: personal
                clientReference: null
                receiptCount: 1
                claimId: null
                ownerId: usr_123
                recordedAt: '2026-09-10T18:30:00Z'
                updatedAt: '2026-09-23T09:00:00Z'
        '409':
          description: 409 Conflict - Expense in submitted claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: EXPENSE_NOT_EDITABLE
                  rule: BR-25
                  message: This expense belongs to claim 'clm_010' which is in 'submitted' status and cannot be amended.
      tags:
        - Expenses
      description: |-
        Amends an existing expense. Only the owner may update it (BR-02, BR-05).

        **Business rules:**
        - Cannot amend an expense that is part of a submitted, approved, or reimbursed claim (BR-25)
        - Amount must remain greater than zero (BR-16)
        - Date incurred must not be in the future (BR-17)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                amount:
                  type: integer
            example:
              description: Train to Manchester client site (return)
              amount: 135
    delete:
      summary: Delete Expense
      responses:
        '204':
          description: 204 No Content - Deleted
        '409':
          description: 409 Conflict - Expense in approved claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: EXPENSE_NOT_EDITABLE
                  rule: BR-25
                  message: This expense belongs to claim 'clm_010' which is in 'approved' status and cannot be deleted.
      tags:
        - Expenses
      description: |-
        Deletes an expense. Only the owner may delete it (BR-02, BR-05).

        **Business rules:**
        - Cannot delete an expense that is part of a submitted, approved, or reimbursed claim (BR-25)
  '/expenses/{expenseId}/receipts':
    get:
      summary: List Receipts
      responses:
        '200':
          description: 200 OK - No receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {}
                  total:
                    type: integer
              examples:
                200 OK - No receipts:
                  value:
                    data: []
                    total: 0
                200 OK - Receipts list:
                  value:
                    data:
                      - id: rec_001
                        expenseId: exp_001
                        filename: train_receipt.jpg
                        mimeType: image/jpeg
                        sizeBytes: 204800
                        uploadedAt: '2026-09-10T18:35:00Z'
                        uploadedBy: usr_123
                    total: 1
      tags:
        - Receipts
      description: |-
        Returns all receipt attachments for a given expense.
        Only the expense owner (or Finance) may access receipts (BR-05).

        **NFR-07** – Receipts may be JPEG, PNG, or PDF, up to 10 MB each. Max 10 per expense.
    parameters:
      - name: expenseId
        in: path
        required: true
        description: The unique identifier of the expense.
        schema:
          type: string
        example: exp_001
    post:
      summary: Upload Receipt
      responses:
        '201':
          description: 201 Created - Receipt uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  expenseId:
                    type: string
                  filename:
                    type: string
                  mimeType:
                    type: string
                  sizeBytes:
                    type: integer
                  uploadedAt:
                    type: string
                    format: date-time
                  uploadedBy:
                    type: string
              example:
                id: rec_001
                expenseId: exp_001
                filename: train_receipt.jpg
                mimeType: image/jpeg
                sizeBytes: 204800
                uploadedAt: '2026-09-10T18:35:00Z'
                uploadedBy: usr_123
        '415':
          description: 415 Unsupported Media Type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: UNSUPPORTED_FILE_TYPE
                  rule: NFR-07
                  message: 'Unsupported file type. Accepted formats are JPEG, PNG, and PDF.'
        '422':
          description: 422 Unprocessable - File too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              examples:
                422 Unprocessable - File too large:
                  value:
                    error:
                      code: FILE_TOO_LARGE
                      rule: NFR-07
                      message: Receipt file exceeds the maximum allowed size of 10 MB.
                422 Unprocessable - Max receipts reached:
                  value:
                    error:
                      code: MAX_RECEIPTS_REACHED
                      rule: NFR-07
                      message: 'This expense already has 10 receipts attached, which is the maximum allowed.'
      tags:
        - Receipts
      description: |-
        Attaches a receipt image to an expense (BR-04).

        **Business rules:**
        - Accepted formats: JPEG, PNG, PDF (NFR-07)
        - Maximum file size: 10 MB per receipt (NFR-07)
        - Maximum 10 receipts per expense (NFR-07)
        - A receipt is mandatory when the expense amount exceeds the category receipt threshold (BR-19)
        - Client Entertainment always requires a receipt (BR-20)
        - Only the expense owner may attach receipts (BR-05)
  '/expenses/{expenseId}/receipts/{receiptId}':
    delete:
      summary: Delete Receipt
      responses:
        '204':
          description: 204 No Content - Deleted
          content:
            application/json:
              schema:
                type: object
        '404':
          description: 404 Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: RECEIPT_NOT_FOUND
                  message: No receipt found with id 'rec_999' on expense 'exp_001'.
        '409':
          description: 409 Conflict - Claim is submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      rule:
                        type: string
                      message:
                        type: string
              example:
                error:
                  code: EXPENSE_NOT_EDITABLE
                  rule: BR-25
                  message: Receipts cannot be removed from an expense that is part of a submitted claim.
      tags:
